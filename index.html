<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noor</title>

<style>

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f5f5f5;
 color:#222;
}

header{
 background:#176b4d;
 color:white;
 padding:20px;
 text-align:center;
 font-size:28px;
 font-weight:bold;
}

.search{
 padding:15px;
}

#search{
 width:100%;
 box-sizing:border-box;
 padding:14px;
 border:1px solid #ccc;
 border-radius:10px;
 font-size:18px;
}

#list{
 padding:10px;
}

.surah{
 background:white;
 margin:8px 0;
 padding:17px;
 border-radius:10px;
 display:flex;
 justify-content:space-between;
 cursor:pointer;
 font-size:20px;
 box-shadow:0 1px 4px #ddd;
}

.num{
 color:#176b4d;
 font-weight:bold;
}

.detail{
 display:none;
 padding:15px;
}

.back{
 background:#176b4d;
 color:white;
 border:0;
 padding:12px 18px;
 border-radius:8px;
 font-size:17px;
}

#title{
 text-align:center;
}

.ayah{
 background:white;
 margin:12px 0;
 padding:20px;
 border-radius:10px;
 font-size:23px;
 line-height:2;
 text-align:right;
}

.result{
 background:white;
 margin:10px 0;
 padding:15px;
 border-radius:10px;
 cursor:pointer;
 box-shadow:0 1px 4px #ddd;
}

.result small{
 color:#176b4d;
 display:block;
 margin-bottom:8px;
 font-weight:bold;
}

</style>

</head>

<body>

<header>
📖 نوور
</header>

<div class="search">

<input
 id="search"
 placeholder="گەڕان لە ناوی سورەت یان ئایەت..."
 oninput="searchAll()"
>

</div>

<div id="list"></div>

<div id="detail" class="detail">

<button class="back" onclick="showList()">
← گەڕانەوە
</button>

<h2 id="title"></h2>

<div id="ayahs"></div>

</div>

<script>

const surahs = [

"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف",
"الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر",
"النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون",
"النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر",
"غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف",
"محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر",
"الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف",
"الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم",
"الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان",
"المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين",
"الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة",
"الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل",
"قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص",
"الفلق","الناس"

];

const list =
document.getElementById("list");

const detail =
document.getElementById("detail");

let allAyahs = [];


/* لیستی سورەتەکان */

function render(){

 list.innerHTML="";

 surahs.forEach((name,i)=>{

  const div =
  document.createElement("div");

  div.className="surah";

  div.innerHTML =
  `<span>${name}</span>
   <span class="num">${i+1}</span>`;

  div.onclick =
  () => openSurah(name);

  list.appendChild(div);

 });

}


/* کردنەوەی سورەت */

async function openSurah(name){

 list.style.display="none";

 document.querySelector(".search")
 .style.display="none";

 detail.style.display="block";

 document.getElementById("title")
 .textContent="سورەتی "+name;

 const number =
 surahs.indexOf(name)+1;

 document.getElementById("ayahs")
 .innerHTML=
 `<div class="ayah">
 چاوەڕێ بکە... 📖
 </div>`;

 try{

  const response =
  await fetch(
  "https://api.alquran.cloud/v1/surah/"
  +number+
  "/quran-uthmani"
  );

  const data =
  await response.json();

  const verses =
  data.data.ayahs;

  document.getElementById("ayahs")
  .innerHTML=

  verses.map(ayah=>`

   <div class="ayah">

   ${ayah.text}

   ﴿${ayah.numberInSurah}﴾

   </div>

  `).join("");

 }catch(error){

  document.getElementById("ayahs")
  .innerHTML=
  `<div class="ayah">
  ببورە، دەقی سورەتەکە نەهێنرا.
  </div>`;

 }

 window.scrollTo(0,0);

}


/* گەڕان */

async function searchAll(){

 const q =
 document.getElementById("search")
 .value.trim();

 if(q===""){

  detail.style.display="none";

  list.style.display="block";

  render();

  return;

 }


 /* گەڕان لە ناوی سورەت */

 const names =
 surahs.filter(name =>
 name.includes(q)
 );


 list.innerHTML="";


 names.forEach(name=>{

  const div =
  document.createElement("div");

  div.className="result";

  div.innerHTML=
  `<small>سورەت</small>
   ${name}`;

  div.onclick =
  ()=>openSurah(name);

  list.appendChild(div);

 });


 /* گەڕان لە ئایەتەکان */

 try{

  if(allAyahs.length===0){

   const response =
   await fetch(
   "https://api.alquran.cloud/v1/quran/quran-uthmani"
   );

   const data =
   await response.json();

   allAyahs =
   data.data.surahs;

  }

  allAyahs.forEach(surah=>{

   surah.ayahs.forEach(ayah=>{

    if(
    ayah.text.includes(q)
    ){

     const div =
     document.createElement("div");

     div.className="result";

     div.innerHTML=

     `<small>
      سورەتی ${surah.name}
      - ئایەتی ${ayah.numberInSurah}
     </small>

     ${ayah.text}`;

     div.onclick =
     ()=>openSurah(surah.name);

     list.appendChild(div);

    }

   });

  });

 }catch(error){

  console.log(error);

 }

}


/* گەڕانەوە */

function showList(){

 detail.style.display="none";

 list.style.display="block";

 document.querySelector(".search")
 .style.display="block";

 document.getElementById("search")
 .value="";

 render();

}


render();

</script>

</body>
</html>
