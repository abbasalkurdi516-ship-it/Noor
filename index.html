<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قورئانی پیرۆز</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f5;
  color:#222;
  font-family:Tahoma,Arial,sans-serif;
}

header{
  background:#176b4d;
  color:white;
  padding:20px 12px;
  text-align:center;
}

header h1{
  margin:0 0 15px;
  font-size:25px;
}

#search{
  width:100%;
  max-width:700px;
  padding:15px;
  border:none;
  border-radius:12px;
  font-size:18px;
  outline:none;
  direction:rtl;
}

#status{
  margin-top:10px;
  font-size:14px;
}

main{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.result{
  background:white;
  margin-bottom:10px;
  padding:15px;
  border-radius:12px;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  cursor:pointer;
}

.result:active{
  transform:scale(.99);
}

.small{
  display:block;
  color:#176b4d;
  font-size:13px;
  margin-bottom:8px;
}

.surah-name{
  font-size:20px;
  font-weight:bold;
}

.ayah{
  font-family:"Amiri",Tahoma,Arial,sans-serif;
  font-size:24px;
  line-height:2.2;
  text-align:right;
}

.title{
  color:#176b4d;
  font-size:25px;
  font-weight:bold;
  text-align:center;
  margin-bottom:15px;
}

button{
  background:#176b4d;
  color:white;
  border:none;
  padding:11px 18px;
  border-radius:10px;
  font-size:16px;
  margin-bottom:15px;
}

.empty{
  background:white;
  padding:25px;
  border-radius:12px;
  text-align:center;
}

.hidden{
  display:none;
}

</style>
</head>


<body>


<header>

<h1>📖 قورئانی پیرۆز</h1>

<input
  id="search"
  type="search"
  placeholder="لە قورئان بگەڕێ... نموونە: الله"
>

<div id="status">
لە بارکردنی قورئان...
</div>

</header>


<main>

<button
  id="backButton"
  class="hidden"
  onclick="showSurahs()"
>
↩ گەڕانەوە بۆ سورەتەکان
</button>

<div id="list"></div>

</main>



<script>


/* =========================
   گۆڕینی دەقی عەرەبی
   ========================= */

function normalizeArabic(text){

  return String(text)

    .normalize("NFD")

    /* سڕینەوەی حەرەکەت */
    .replace(/[\u064B-\u065F\u0670]/g,"")

    /* جۆرەکانی ئەلف */
    .replace(/[إأٱآ]/g,"ا")

    /* جۆرەکانی ی */
    .replace(/[ى]/g,"ي")

    /* جۆرەکانی و */
    .replace(/[ؤ]/g,"و")

    /* ة */
    .replace(/[ة]/g,"ه")

    /* ـ */
    .replace(/[ـ]/g,"")

    /* بۆشایی */
    .replace(/\s+/g," ")

    .trim();

}



/* =========================
   گۆڕاوە سەرەکییەکان
   ========================= */

let quran = [];

const list =
document.getElementById("list");

const search =
document.getElementById("search");

const status =
document.getElementById("status");

const backButton =
document.getElementById("backButton");



/* =========================
   هێنانی قورئان
   ========================= */

async function loadQuran(){

  try{

    const response =
    await fetch(
      "https://api.alquran.cloud/v1/quran/quran-uthmani"
    );


    if(!response.ok){

      throw new Error("Network error");

    }


    const data =
    await response.json();


    quran =
    data.data.surahs;


    status.innerText =
      "قورئان ئامادەیە — ١١٤ سورەت";


    showSurahs();


  }catch(error){

    console.log(error);


    status.innerText =
      "کێشەیەک ڕوویدا";


    list.innerHTML = `

      <div class="empty">

        نەتوانرا قورئان بار بکرێت.

        <br><br>

        تکایە ئینتەرنێت بپشکنە.

      </div>

    `;

  }

}



/* =========================
   پیشاندانی هەموو سورەتەکان
   ========================= */

function showSurahs(){

  search.value = "";

  backButton.classList.add("hidden");

  list.innerHTML = "";


  quran.forEach(function(surah){

    const div =
    document.createElement("div");


    div.className =
      "result";


    div.innerHTML = `

      <span class="small">
        سورەتی ${surah.number}
      </span>

      <div class="surah-name">
        ${surah.name}
      </div>

      <span>
        ${surah.ayahs.length} ئایەت
      </span>

    `;


    div.onclick =
      function(){

        openSurah(surah);

      };


    list.appendChild(div);

  });


  status.innerText =
    "هەموو سورەتەکان";


  window.scrollTo(0,0);

}



/* =========================
   کردنەوەی سورەت
   ========================= */

function openSurah(surah){

  search.value = "";

  backButton.classList.remove("hidden");

  list.innerHTML = "";


  const title =
    document.createElement("div");


  title.className =
    "title";


  title.innerText =
    surah.name;


  list.appendChild(title);



  surah.ayahs.forEach(function(ayah){

    const div =
    document.createElement("div");


    div.className =
      "result";


    div.innerHTML = `

      <span class="small">
        ئایەتی ${ayah.numberInSurah}
      </span>

      <div class="ayah">
        ${ayah.text}
      </div>

    `;


    list.appendChild(div);

  });


  status.innerText =
    surah.name;


  window.scrollTo(0,0);

}



/* =========================
   گەڕان
   ========================= */

function searchQuran(){

  const original =
    search.value.trim();


  /* ئەگەر Search بەتاڵە */

  if(original === ""){

    showSurahs();

    return;

  }


  const query =
    normalizeArabic(original);


  list.innerHTML = "";

  backButton.classList.remove("hidden");


  let count = 0;



  /* =========================
     گەڕان لە ناوی سورەت
     ========================= */

  quran.forEach(function(surah){

    const name =
      normalizeArabic(surah.name);


    if(name.includes(query)){

      const div =
      document.createElement("div");


      div.className =
        "result";


      div.innerHTML = `

        <span class="small">
          سورەت
        </span>

        <div class="surah-name">
          ${surah.name}
        </div>

      `;


      div.onclick =
        function(){

          openSurah(surah);

        };


      list.appendChild(div);


      count++;

    }

  });



  /* =========================
     گەڕان لە هەموو ئایەتەکان
     ========================= */

  quran.forEach(function(surah){

    surah.ayahs.forEach(function(ayah){

      const text =
        normalizeArabic(ayah.text);


      if(text.includes(query)){

        const div =
        document.createElement("div");


        div.className =
          "result";


        div.innerHTML = `

          <span class="small">

            ${surah.name}

            — ئایەتی

            ${ayah.numberInSurah}

          </span>

          <div class="ayah">

            ${ayah.text}

          </div>

        `;


        div.onclick =
          function(){

            openSurah(surah);

          };


        list.appendChild(div);


        count++;

      }

    });

  });



  /* =========================
     ئەگەر هیچ نەدۆزرایەوە
     ========================= */

  if(count === 0){

    list.innerHTML = `

      <div class="empty">

        هیچ ئەنجامێک نەدۆزرایەوە.

        <br><br>

        وشەی

        <b>${original}</b>

        لە قورئاندا نەدۆزرایەوە.

      </div>

    `;


    status.innerText =
      "هیچ ئەنجامێک نییە";

  }else{

    status.innerText =
      count + " ئەنجام دۆزرایەوە";

  }


  window.scrollTo(0,0);

}



/* =========================
   کاتێک لە Search دەنووسیت
   ========================= */

search.addEventListener(
  "input",
  searchQuran
);



/* =========================
   دەستپێکردنی بەرنامە
   ========================= */

loadQuran();


</script>

</body>

</html>
