<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#176b4d;
  color:white;
  padding:20px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.search{
  padding:15px;
}

#search{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:18px;
}

#list{
  padding:10px;
}

.surah{
  background:white;
  margin:8px 0;
  padding:17px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
  font-size:20px;
  box-shadow:0 1px 4px #ddd;
}

.num{
  color:#176b4d;
  font-weight:bold;
}

.detail{
  display:none;
  padding:15px;
}

.back{
  background:#176b4d;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:8px;
  font-size:17px;
}

#title{
  text-align:center;
}

.ayah{
  background:white;
  margin:12px 0;
  padding:20px;
  border-radius:10px;
  font-size:23px;
  line-height:2;
  text-align:right;
}
</style>
</head>

<body>

<header>📖 نوور</header>

<div class="search">
<input
  id="search"
  placeholder="گەڕان بە ناوی سورەت..."
  oninput="searchSurah()"
>
</div>

<div id="list"></div>

<div id="detail" class="detail">
  <button class="back" onclick="showList()">← گەڕانەوە</button>
  <h2 id="title"></h2>
  <div id="ayahs"></div>
</div>

<script>

const surahs = [
"الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف",
"الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر",
"النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون",
"النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم",
"لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر",
"غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف",
"محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر",
"الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف",
"الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم",
"الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان",
"المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين",
"الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد",
"الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة",
"الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل",
"قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص",
"الفلق","الناس"
];

const list = document.getElementById("list");
const detail = document.getElementById("detail");

function render(data = surahs){

  list.innerHTML = "";

  data.forEach((name) => {

    const div = document.createElement("div");

    div.className = "surah";

    div.innerHTML =
      `<span>${name}</span>
       <span class="num">${surahs.indexOf(name) + 1}</span>`;

    div.onclick = () => openSurah(name);

    list.appendChild(div);
  });
}

function searchSurah(){

  const q = document.getElementById("search").value.trim();

  render(
    surahs.filter(name => name.includes(q))
  );
}

async function openSurah(name){

  list.style.display = "none";
  document.querySelector(".search").style.display = "none";
  detail.style.display = "block";

  document.getElementById("title").textContent =
    "سورەتی " + name;

  const surahNumber = surahs.indexOf(name) + 1;

  document.getElementById("ayahs").innerHTML =
    `<div class="ayah">چاوەڕێ بکە... 📖</div>`;

  try{

    const response = await fetch(
      "https://api.alquran.cloud/v1/surah/" +
      surahNumber +
      "/quran-uthmani"
    );

    if(!response.ok){
      throw new Error("API error");
    }

    const result = await response.json();

    if(
      !result.data ||
      !result.data.ayahs ||
      result.data.ayahs.length === 0
    ){
      throw new Error("No ayahs");
    }

    const verses = result.data.ayahs;

    document.getElementById("ayahs").innerHTML =
      verses.map(ayah => `
        <div class="ayah">
          ${ayah.text}
          ﴿${ayah.numberInSurah}﴾
        </div>
      `).join("");

  }catch(error){

    console.error(error);

    document.getElementById("ayahs").innerHTML =
      `<div class="ayah">
        ببورە، دەقی سورەتەکە نەهێنرا.
        تکایە دووبارە هەوڵ بدەرەوە.
      </div>`;
  }

  window.scrollTo(0,0);
}

function showList(){

  detail.style.display = "none";
  list.style.display = "block";
  document.querySelector(".search").style.display = "block";

}

render();

</script>

</body>
</html>
